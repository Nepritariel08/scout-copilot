name: Scout mobile test APK

on:
  pull_request:
    paths:
      - "openbot/mobile/**"
      - "openbot/server/src/auth/index.ts"
      - "openbot/server/tests/auth-mobile-scheme.integration.test.ts"
      - "openbot/docs/configuration.md"
      - "scout/OWNED-ENTRA.md"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Build standalone Android test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openbot/mobile/package-lock.json
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK build packages
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - run: npm ci --ignore-scripts
        working-directory: openbot/mobile
      - name: Verify public Scout origin in Expo config
        run: |
          npx expo config --type public --json > scout-mobile-config.json
          node -e 'const c = require("./scout-mobile-config.json"); const expected = "https://scout.somethingsomewhere.ph"; if (c.extra?.scoutServerUrl !== expected) { console.error(`Unexpected Scout origin: ${c.extra?.scoutServerUrl}`); process.exit(1); }'
        working-directory: openbot/mobile
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SERVER_URL: https://scout.somethingsomewhere.ph
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: openbot/mobile
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_PUBLIC_SERVER_URL: https://scout.somethingsomewhere.ph
      - name: Bundle JavaScript and build a debug-signed release APK
        run: ./gradlew --no-daemon assembleRelease
        working-directory: openbot/mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SERVER_URL: https://scout.somethingsomewhere.ph
      - name: Verify Scout origin is bundled in the APK
        run: |
          python - <<'PY'
          import json
          import zipfile

          apk_path = "openbot/mobile/android/app/build/outputs/apk/release/app-release.apk"
          expected = "https://scout.somethingsomewhere.ph"
          with zipfile.ZipFile(apk_path) as apk:
              bundle_name = next(
                  (name for name in apk.namelist() if name.endswith("assets/index.android.bundle")),
                  None,
              )
              if bundle_name is None:
                  raise SystemExit("APK is missing the embedded Android JavaScript bundle")
              if b"scoutServerUrl" not in apk.read(bundle_name):
                  raise SystemExit("Scout client bundle does not read the configured server origin")
              config_name = next(
                  (name for name in apk.namelist() if name.endswith("assets/app.config")),
                  None,
              )
              if config_name is None:
                  raise SystemExit("APK is missing its embedded Expo app.config")
              config = json.loads(apk.read(config_name))
              actual = config.get("extra", {}).get("scoutServerUrl")
              if actual != expected:
                  raise SystemExit(f"Expected Scout origin {expected!r}, found {actual!r}")
          print(f"Verified {expected} in the embedded Expo config used by {apk_path}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scout-android-test-apk
          path: openbot/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
