name: Odoo 20 JSON-2 qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/odoo20-context-qualification.yml
      - openbot/server/src/scout/owned-model/odoo-json2.ts
      - openbot/server/tests/fixtures/odoo20-qualification-seed.py
      - openbot/server/tests/fixtures/run-odoo20-context-qualification.sh
      - openbot/server/tests/odoo20-context-qualification.integration.test.ts
      - scout/ODOO20-QUALIFICATION.md

permissions:
  contents: read

jobs:
  real-odoo-json2:
    name: Real Odoo 20 Community JSON-2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: openbot
      - name: Run isolated real Odoo qualification
        run: bash server/tests/fixtures/run-odoo20-context-qualification.sh
        working-directory: openbot
